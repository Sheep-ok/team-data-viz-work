<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=1527, user-scalable=yes">
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 1527px !important;
            height: 740px !important;
            overflow: hidden !important;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <meta charset="UTF-8">
    <title>古建灵犀 - AI智能向导</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SimSun", "宋体", "KaiTi", "楷体", serif;
            background-color: #ffffff;
        }

        /* ========== 聊天容器样式 ========== */
        .chat-wrapper {
            width: 900px;
            height: 500px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .chat-container {
            width: 100%;
            height: 100%;
            background-image: url('ai背景.png');
            background-size: cover;
            background-position: center;
            background-color: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 标题区域 */
        .chat-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 32px;
            font-weight: normal;
            color: #fffdf0;
            letter-spacing: 6px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* 消息区域 - 可滚动 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 自定义滚动条 */
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 消息气泡 */
        .message {
            max-width: 70%;
            padding: 10px 15px;
            line-height: 1.7;
            font-size: 14px;
            border-radius: 4px;
        }

        .message.ai-message {
            align-self: flex-start;
            background-color: rgba(252, 249, 242, 0.7);
            color: #1a1a1a;
        }

        .message.user-message {
            align-self: flex-end;
            background-color: rgba(30, 30, 30, 0.7);
            color: #ffffff;
        }

        /* 输入区域 */
        .chat-input-area {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-family: "SimSun", "宋体", "KaiTi", "楷体", serif;
            color: #222222;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        .chat-input:focus {
            border-bottom-color: rgba(0, 0, 0, 0.6);
        }

        /* 发送按钮 - 金石篆刻风格 */
        .send-btn {
            width: 42px;
            height: 42px;
            background-color: #8b2500;
            color: #fcf9f2;
            border: 1px solid #8b2500;
            border-radius: 6px 2px 8px 3px;
            box-shadow: inset 0 0 0 1px #8b2500, inset 0 0 0 3px #fcf9f2, 2px 4px 8px rgba(139, 37, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 0 1px #8b2500, inset 0 0 0 3px #fcf9f2, 4px 6px 12px rgba(139, 37, 0, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 0 0 1px #8b2500, inset 0 0 0 3px #fcf9f2, 1px 2px 4px rgba(139, 37, 0, 0.2);
        }

        .send-btn-text {
            font-family: "KaiTi", "STKaiti", "LiSu", serif;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background-color: rgba(139, 37, 0, 0.8);
            color: #fcf9f2;
            border: 1px solid #8b2500;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background-color: #8b2500;
            transform: scale(1.1);
        }

        .close-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- 聊天容器 -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <!-- 关闭按钮 -->
            <button class="close-btn" id="closeBtn" title="关闭">×</button>
            <!-- 标题 -->
            <div class="chat-header">
                <h1 class="chat-title">古建灵犀</h1>
            </div>

            <!-- 消息区域 -->
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">欢迎来到「古建灵犀」智能向导，我是您的古建筑知识顾问，愿为君一二陈之。</div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="请输入您想了解的古建筑知识..." autocomplete="off">
                </div>
                <button class="send-btn" id="sendBtn">
                    <span class="send-btn-text">落墨</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var chatMessages = document.getElementById('chatMessages');
            var chatInput = document.getElementById('chatInput');
            var sendBtn = document.getElementById('sendBtn');

            // ========== API 配置 ==========
            // 本地开发时使用：http://localhost:3000
            // 部署到 Zeabur 后改为：https://你的项目名.zeabur.app
            var API_BASE_URL = 'https://gujian-project.zeabur.app';
            // ==============================

            // 对话历史数组（存储上下文）
            var conversationHistory = [];

            // 古风思考提示语（AI思考时显示）
            var thinkingMessages = [
                "先生所言极是，容我思量一二...",
                "此问颇有意趣，待我细述...",
                "古建之道，博大精深，且听我慢慢道来...",
                "此乃我中华建筑之精髓，容我详解...",
                "先生/姑娘所问甚好，容我一二陈之..."
            ];

            function getRandomThinking() {
                return thinkingMessages[Math.floor(Math.random() * thinkingMessages.length)];
            }

            // 管理对话历史：超过10条删除最早的2条
            function addToHistory(role, content) {
                conversationHistory.push({ role: role, content: content });
                
                // 如果超过10条，删除最早的2条
                if (conversationHistory.length > 10) {
                    conversationHistory.shift();
                    conversationHistory.shift();
                }
            }

            // 滚动到底部
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 创建用户消息
            function createUserMessage(text) {
                var msg = document.createElement('div');
                msg.className = 'message user-message';
                msg.textContent = text;
                chatMessages.appendChild(msg);
                scrollToBottom();
            }

            // 创建AI消息
            function createAIMessage(text) {
                var msg = document.createElement('div');
                msg.className = 'message ai-message';
                msg.innerHTML = text;  // 使用 innerHTML 支持 HTML 加粗标签
                chatMessages.appendChild(msg);
                scrollToBottom();
            }

            // 创建思考中的消息（带删除标记）
            function createThinkingMessage() {
                var msg = document.createElement('div');
                msg.className = 'message ai-message';
                msg.textContent = getRandomThinking();
                msg.id = 'thinking-msg';
                chatMessages.appendChild(msg);
                scrollToBottom();
                return msg;
            }

            // 删除思考中的消息
            function removeThinkingMessage() {
                var thinkingMsg = document.getElementById('thinking-msg');
                if (thinkingMsg) {
                    thinkingMsg.remove();
                }
            }

            // 发送消息
            function sendMessage() {
                var text = chatInput.value.trim();
                if (text === '') return;

                // 禁用输入和按钮
                chatInput.disabled = true;
                sendBtn.disabled = true;

                // 添加到对话历史
                addToHistory('user', text);

                // 显示用户消息
                createUserMessage(text);
                chatInput.value = '';

                // 显示思考中提示
                createThinkingMessage();

                // 调用后端 API
                fetch(API_BASE_URL + '/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    // 删除思考中提示
                    removeThinkingMessage();
                    
                    // 添加 AI 回复到历史
                    addToHistory('assistant', data.reply);
                    
                    // 显示 AI 回复
                    createAIMessage(data.reply);
                })
                .catch(function(error) {
                    // 删除思考中提示
                    removeThinkingMessage();
                    
                    // 显示错误消息
                    createAIMessage('网络连接似乎有些问题，还望先生/姑娘稍后再试。');
                    console.error('API 调用错误:', error);
                })
                .finally(function() {
                    // 恢复输入和按钮
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    chatInput.focus();
                });
            }

            // 绑定回车事件
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // 绑定点击事件
            sendBtn.addEventListener('click', sendMessage);

            // 关闭按钮事件
            var closeBtn = document.getElementById('closeBtn');
            closeBtn.addEventListener('click', function() {
                // 清空对话历史（每次关闭都重置上下文）
                conversationHistory = [];
                document.querySelector('.chat-wrapper').style.display = 'none';
            });

            // 自动聚焦
            chatInput.focus();
        })();
    </script>
</body>
</html>

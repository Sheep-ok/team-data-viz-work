<head>

    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        /* ========== 简化二次页面样式 ========== */
        :root {
            /* 纯色背景 */
            --secondary-bg-color: #4a90e2;
        }

        /* 二次页面容器 - 纯色背景 */
        #secondary-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--secondary-bg-color);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 二次页面激活状态 */
        #secondary-page.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ========== 书本样式 ========== */
        /* 二次页面背景 */
        #secondary-page {
            background: linear-gradient(135deg, #8B4513 0%, #D2B48C 50%, #8B4513 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }
        
        /* 背景图片样式 - 半透明模糊效果 */
        #secondary-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(200px) brightness(0.5);
            transform: scale(1.1);
            z-index: 1;
        }
        
        /* 确保其他内容在背景之上 */
        #secondary-page > * {
            position: relative;
            z-index: 2;
        }
        
        /* 书本容器 */
        #book-container {
            perspective: 1200px;
        }
        
        /* 书本 */
        #book {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* 书页基础样式 */
        .book-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 253, 240, 0.7);
            background-image: linear-gradient(to right, rgba(248, 244, 227, 0.6) 0%, rgba(255, 253, 240, 0.6) 100%);
            border: 2px solid rgba(139, 69, 19, 0.4);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            overflow: hidden;
            backface-visibility: hidden;
            will-change: transform, opacity;
            transform: translateZ(0);
        }
        
        /* 活跃页面样式 */
        .book-page.active {
            opacity: 1;
            pointer-events: all;
            transform: perspective(1000px) rotateY(0deg) translateZ(0px) scale(1);
            z-index: 10;
        }
        
        /* 页面切换动画 - 上一页退出 */
        .book-page.prev-exit {
            opacity: 0;
            transform: perspective(1000px) rotateY(-90deg) translateZ(-100px) scale(0.8);
            z-index: 5;
        }
        
        /* 页面切换动画 - 下一页退出 */
        .book-page.next-exit {
            opacity: 0;
            transform: perspective(1000px) rotateY(90deg) translateZ(-100px) scale(0.8);
            z-index: 5;
        }
        
        /* 页面切换动画 - 上一页进入 */
        .book-page.prev-enter {
            opacity: 1;
            transform: perspective(1000px) rotateY(90deg) translateZ(-100px) scale(0.8);
            animation: prevPageEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        /* 页面切换动画 - 下一页进入 */
        .book-page.next-enter {
            opacity: 1;
            transform: perspective(1000px) rotateY(-90deg) translateZ(-100px) scale(0.8);
            animation: nextPageEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        /* 上一页进入动画 */
        @keyframes prevPageEnter {
            to {
                transform: perspective(1000px) rotateY(0deg) translateZ(0px) scale(1);
                opacity: 1;
            }
        }
        
        /* 下一页进入动画 */
        @keyframes nextPageEnter {
            to {
                transform: perspective(1000px) rotateY(0deg) translateZ(0px) scale(1);
                opacity: 1;
            }
        }
        
        /* 书页内图片样式 */
        .book-page .page-image {
            width: 80%;
            height: 70%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid #8B4513;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* 图片悬停效果 */
        .book-page .page-image:hover {
            transform: scale(1.05);
        }
        
        /* 书页标题 */
        .book-page h2 {
            font-size: 24px;
            color: #8B4513;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* 翻页箭头样式 */
        .page-arrow {
            transition: all 0.3s ease;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        /* 箭头悬停效果 */
        .page-arrow:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.2);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        
        /* 数据可视化区域 */
        .visualization-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        
        /* 3D模型容器 */
        #model-container {
            border: 2px solid #8B4513;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }
        
        /* 二次页面按钮样式 */
        #secondary-buttons button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #8B4513;
            background: #fffdf0;
            border: 2px solid #8B4513;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 180px;
        }
        
        #secondary-buttons button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #f8f4e3;
        }

        /* ========== 跳过抽卡按钮样式 ========== */
        .skip-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        /* 跳过抽卡按钮悬停效果 */
        .skip-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        /* ========== 顶部下拉菜单导航样式 ========== */
        /* 导航栏容器 */
        #top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: transparent;
            z-index: 9000;
        }

        /* 调整侧边索引栏位置 */
        #sidebar-index {
            top: 80px;
        }
        
        /* 调整按钮容器位置 */
        #secondary-buttons {
            bottom: 20px;
        }
        
        /* 调整下一步按钮位置 */
        #next-page-btn {
            bottom: 20px;
        }

        /* 导航内容容器 */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 导航品牌 */
        .nav-brand {
            padding: 5px 0;
            margin-right: 30px;
        }

        .nav-brand a {
            color: #fffdf0;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .nav-brand a:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 导航菜单 */
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
        }

        /* 导航链接 */
        .nav-link {
            display: block;
            padding: 8px 12px;
            color: #fffdf0;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .nav-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* 下拉菜单 */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            min-width: 100px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9100;
        }

        /* 下拉菜单项 */
        .dropdown-item {
            list-style: none;
        }

        .dropdown-link {
            display: block;
            padding: 8px 12px;
            color: black;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .dropdown-link:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        /* 导航项悬停时显示下拉菜单 */
        .nav-item:hover .dropdown-menu {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* ========== 鼠标跟随效果样式 ========== */
        /* 基础样式 */
        * {
            cursor: none;
        }

        /* 鼠标跟随容器 */
        #mouse-follower {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            overflow: visible;
        }

        /* 鼠标小圆点 */
        #mouse-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            mix-blend-mode: difference;
        }

        /* 鼠标圆圈 */
        #mouse-circle {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }
    </style>
</head>

                // 创建相机 - 使用容器宽高比
                camera = new THREE.PerspectiveCamera(75, containerWidth / containerHeight, 0.1, 1000);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

                // 添加多种光源，确保模型被充分照亮

                scene.add(ambientLight);
                
                // 方向光 - 模拟太阳光

                directionalLight1.position.set(5, 10, 7.5);
                scene.add(directionalLight1);
                
                const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.7);
                directionalLight2.position.set(-5, 5, -7.5);
                scene.add(directionalLight2);
                
                // 点光源
                const pointLight1 = new THREE.PointLight(0xffffff, 0.8);

                scene.add(pointLight1);
                
                const pointLight2 = new THREE.PointLight(0xffffff, 0.7);
                pointLight2.position.set(5, 0, -5);
                scene.add(pointLight2);

                pointLight3.position.set(-5, 0, 5);
                scene.add(pointLight3);
                
                // 添加两个新光源，总共8个灯光

                directionalLight3.position.set(0, -10, 0);
                scene.add(directionalLight3);
                
                const pointLight4 = new THREE.PointLight(0xffffff, 0.5);
                pointLight4.position.set(0, -5, -5);

                // 尝试创建轨道控制器

                    controls.maxDistance = 6; // 减小最大距离，使最小缩放限制变大
                    controls.zoomSpeed = 0.8; // 调整缩放速度，加快一点
                    controls.enableDamping = true; // 启用阻尼效果

            // 加载GLB模型
            function loadGLBModel() {
                console.log('Loading GLB model...');
                
                // 根据当前页面索引选择对应的GLB文件
                let modelPath;
                switch (currentPageIndex) {
                    case 1: // 京派
                        modelPath = '北京四合院.glb';
                        break;
                    case 2: // 粤派
                        modelPath = '广东镬耳墙.glb';
                        break;
                    case 3: // 徽派
                        modelPath = '安徽马头墙.glb';
                        break;
                    case 4: // 苏派
                        modelPath = '苏州庭院.glb';
                        break;
                    case 5: // 晋派
                        modelPath = '山西大院.glb';
                        break;
                    case 6: // 闽派
                        modelPath = '福建土楼.glb';
                        break;
                    case 7: // 海派
                        modelPath = '上海石库门.glb';
                        break;
                    case 8: // 川派
                        modelPath = '川渝吊脚楼.glb';
                        break;
                    default:
                        console.warn('No GLB model specified for page', currentPageIndex);
                        return;
                }
                
                console.log('Loading model:', modelPath);
                
                // 尝试创建GLTFLoader实例
                try {
                    const loader = new THREE.GLTFLoader();
                    
                    loader.load(
                        modelPath,
                        function (gltf) {
                            console.log('Model loaded successfully:', gltf);
                            
                            // 确保场景存在（防止异步加载完成时场景已被销毁）
                            if (!scene) {
                                console.warn('Scene is null, cannot add model');
                                return;
                            }
                            
                            // 移除旧模型（如果存在）
                            if (model) {
                                scene.remove(model);
                                console.log('Old model removed from scene');
                            }
                            
                            model = gltf.scene;
                            
                            // 计算模型边界盒，用于调整位置和缩放
                            const box = new THREE.Box3().setFromObject(model);
                            const center = box.getCenter(new THREE.Vector3());
                            const size = box.getSize(new THREE.Vector3());
                            
                            // 将模型居中并调整位置
                            model.position.sub(center);
                            model.position.y = -0.9; // 模型再往下放一点
                            
                            // 移除旋转，让模型正对着相机
                            model.rotation.set(0, 0, 0);
                            
                            // 计算合适的缩放比例，让模型大小适中
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const scale = 2.5 / maxDim; // 调整缩放比例，使模型大小适中
                            model.scale.setScalar(scale);
                            
                            // 添加模型到场景
                            scene.add(model);
                            
                            // 调整相机位置，让模型居中显示
                            const cameraDistance = 3 * scale;
                            camera.position.set(0, scale * size.y / 2 - 0.9, cameraDistance);
                            camera.lookAt(0, -0.9, 0); // 相机正对着模型中心（考虑模型下移）
                            
                            console.log('Model added to scene');
                        },
                        function (xhr) {
                            console.log('Loading progress:', (xhr.loaded / xhr.total * 100) + '%');
                        },
                        function (error) {
                            console.error('Error loading model:', error);
                        }
                    );
                } catch (error) {
                    console.error('Failed to create GLTFLoader:', error);
                    
                    // 确保场景存在
                    if (!scene) {
                        console.warn('Scene is null, cannot add fallback cube');
                        return;
                    }
                    
                    // 移除旧模型（如果存在）
                    if (model) {
                        scene.remove(model);
                    }
                    
                    // 创建一个简单的立方体作为替代
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                    model = new THREE.Mesh(geometry, material);
                    scene.add(model);
                    console.log('Added fallback cube since GLTFLoader failed');
                }
            }
            
            // 渲染循环
            function animate3D() {
                requestAnimationFrame(animate3D);
                if (controls) controls.update();
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }
            
            // 清理3D资源
            function dispose3DScene() {
                if (renderer) {
                    const container = document.getElementById('model-container');
                    if (container && renderer.domElement) {
                        container.removeChild(renderer.domElement);
                    }
                    renderer.dispose();
                    renderer = null;
                }
                
                scene = null;
                camera = null;
                model = null;
                controls = null;
            }

            // 切换3D模型显示
            function toggle3DModel(pageIndex) {
                currentPageIndex = pageIndex;
                const modelContainer = document.getElementById('model-container');
                const secondaryPage = document.getElementById('secondary-page');
                
                if (!isModelVisible) {
                    // 显示3D模型
                    modelContainer.style.display = 'block';
                    
                    // 设置3D模型容器背景与书本背景一致，只显示图片，不添加其他颜色
                    if (secondaryPage) {

                        modelContainer.style.backgroundBlendMode = 'normal';
                        modelContainer.style.backgroundSize = 'cover';
                        modelContainer.style.backgroundPosition = 'center';
                        modelContainer.style.backgroundRepeat = 'no-repeat';
                        modelContainer.style.backgroundColor = 'transparent';
                    }
                    
                    init3DScene();
                    loadGLBModel();
                    animate3D();
                    
                    // 重新绑定关闭按钮事件，确保按钮可见且可用
                    bindCloseModelBtn();
                    
                    // 创建并显示操作提示
                    createModelHint();

                    modelContainer.style.display = 'none';
                    dispose3DScene();
                    isModelVisible = false;

            // 显示指定页面
            function showPage(index, direction) {
                // 隐藏所有页面
                const pages = document.querySelectorAll('.book-page');
                const currentPage = document.getElementById(`page-${currentPageIndex}`);
                
                // 重置所有页面状态
                pages.forEach(page => {
                    page.classList.remove('active', 'prev-exit', 'next-exit', 'prev-enter', 'next-enter');
                    page.style.opacity = '0';
                    page.style.pointerEvents = 'none';
                });
                
                // 为当前页面添加退出动画
                if (currentPage) {
                    if (direction === 'prev') {
                        currentPage.classList.add('prev-exit');
                    } else if (direction === 'next') {
                        currentPage.classList.add('next-exit');
                    }
                    currentPage.style.zIndex = '5';
                }
                
                // 显示新页面
                const newPage = document.getElementById(`page-${index}`);
                if (newPage) {
                    // 确保新页面在最上层
                    newPage.style.zIndex = '10';
                    
                    // 强制重排，确保动画能够触发
                    void newPage.offsetWidth;
                    
                    // 添加进入动画
                    if (direction === 'prev') {
                        newPage.classList.add('prev-enter');
                    } else if (direction === 'next') {
                        newPage.classList.add('next-enter');
                    } else {
                        // 初始加载时直接显示
                        newPage.classList.add('active');
                        newPage.style.opacity = '1';
                        newPage.style.pointerEvents = 'all';
                        // 初始加载时立即更新图表和背景
                        currentPageIndex = index;
                        updateCharts(currentPageIndex);
                        updateBackground(index);
                        updateIndexButtonState(currentPageIndex);
                        return;
                    }
                }
                
                // 动画结束后更新数据和清理类名
                setTimeout(() => {
                    currentPageIndex = index;
                    
                    // 更新图表
                    updateCharts(currentPageIndex);
                    
                    // 更新背景图片，跟随当前页面图片变化
                    updateBackground(index);
                    
                    // 更新索引按钮状态
                    updateIndexButtonState(currentPageIndex);
                    
                    // 清理类名并设置最终状态
                    pages.forEach(page => {
                        page.classList.remove('prev-exit', 'next-exit', 'prev-enter', 'next-enter');
                        page.style.zIndex = '1';
                        if (page.id === `page-${currentPageIndex}`) {
                            page.classList.add('active');
                            page.style.opacity = '1';
                            page.style.pointerEvents = 'all';
                            page.style.zIndex = '10';
                        } else {
                            page.style.opacity = '0';
                            page.style.pointerEvents = 'none';
                        }
                    });
                }, 800); // 等待动画完全结束后再清理
            }
            
            // 更新背景图片
            function updateBackground(pageIndex) {
                const secondaryPage = document.getElementById('secondary-page');
                if (secondaryPage) {
                    // 获取当前页面的图片路径
                    const imagePath = factionData[pageIndex - 1].frontImage;
                    
                    // 设置背景图片，使用当前页面图片作为背景
                    secondaryPage.style.backgroundImage = `url('${imagePath}')`;
                    // 添加渐变叠加层，增强文字可读性
                    secondaryPage.style.backgroundBlendMode = 'overlay';
                }
            }
            
            // 上一页
            function goToPrevPage() {
                let newIndex;
                if (currentPageIndex > 1) {
                    newIndex = currentPageIndex - 1;
                } else {
                    newIndex = 8;
                }
                
                if (newIndex !== currentPageIndex) {
                    // 直接调用showPage，让它处理所有更新逻辑
                    showPage(newIndex, 'prev');
                }
            }
            
            // 下一页
            function goToNextPage() {
                let newIndex;
                if (currentPageIndex < 8) {
                    newIndex = currentPageIndex + 1;
                } else {
                    newIndex = 1;
                }
                
                if (newIndex !== currentPageIndex) {
                    // 直接调用showPage，让它处理所有更新逻辑
                    showPage(newIndex, 'next');
                }
            }
            
            // 关闭二次页面
            function closeSecondaryPage() {
                // 隐藏二次页面
                secondaryPage.classList.remove('active');
                
                // 隐藏3D模型
                document.getElementById('model-container').style.display = 'none';
                isModelVisible = false;
                
                // 清理3D资源
                dispose3DScene();
            }
            
            // 返回抽卡页面
            function backToDrawPage() {
                window.location.href = '抽卡页面.html';
            }
            
            // 从URL中获取cardIndex参数
            function getCardIndexFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const cardIndex = urlParams.get('cardIndex');
                if (cardIndex) {
                    return parseInt(cardIndex) + 1; // 转换为1-8的页面索引
                }
                return 1; // 默认显示第一页
            }
            
            // 跳转到指定页面
            function goToPage(index) {
                if (index && index !== currentPageIndex) {
                    // 更新页面索引
                    currentPageIndex = index;
                    
                    // 更新页面显示
                    showPage(currentPageIndex);
                    
                    // 更新图表数据
                    updateCharts(currentPageIndex);
                    
                    // 更新索引按钮状态
                    updateIndexButtonState(currentPageIndex);
                }
            }
            
            // 绑定事件
            function bindEvents() {
                // 绑定返回按钮点击事件
                if (secondaryBackBtn) {
                    secondaryBackBtn.addEventListener('click', backToDrawPage);
                }
                
                // 绑定翻页箭头点击事件
                if (prevArrow) {
                    prevArrow.addEventListener('click', goToPrevPage);
                }
                if (nextArrow) {
                    nextArrow.addEventListener('click', goToNextPage);
                }
                
                // 绑定键盘事件，通过左右键切换页面
                document.addEventListener('keydown', function(event) {
                    if (event.key === 'ArrowLeft') {
                        goToPrevPage();
                    } else if (event.key === 'ArrowRight') {
                        goToNextPage();
                    }
                });
                
                // 绑定卡牌展示和数据可视化下拉链接点击事件
                if (dropdownLinks.length > 0) {
                    dropdownLinks.forEach(link => {
                        link.addEventListener('click', function(e) {
                            e.preventDefault();
                            const index = parseInt(this.getAttribute('data-index'));
                            goToPage(index);
                        });
                    });
                }
                
                // 绑定3D模型下拉链接点击事件
                if (modelLinks.length > 0) {
                    modelLinks.forEach(link => {
                        link.addEventListener('click', function(e) {
                            e.preventDefault();
                            const model = this.getAttribute('data-model');
                            const faction = factionData.find(item => item.model === model);
                            if (faction) {
                                // 先切换到对应的页面
                                const index = factionData.indexOf(faction) + 1;
                                goToPage(index);
                                
                                // 延迟显示模型，确保页面切换完成
                                setTimeout(() => {
                                    const page = document.getElementById(`page-${index}`);
                                    if (page) {
                                        const image = page.querySelector('.page-image');
                                        if (image) {
                                            // 模拟点击图片事件来显示模型
                                            image.click();
                                        }
                                    }
                                }, 500);
                            }
                        });
                    });
                }
            }
            
            // 初始化函数
            function init() {
                // 从URL获取cardIndex参数，设置初始页面
                currentPageIndex = getCardIndexFromUrl();
                
                // 初始化书页内容
                initBookPages();
                
                // 显示当前页面（初始加载，无动画）
                showPage(currentPageIndex);
                
                // 初始化图表
                initCharts();
                // 更新图表
                updateCharts(currentPageIndex);
                
                // 绑定事件
                bindEvents();
            }
            
            // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
        })();
        
        // ========== 鼠标跟随效果脚本 ==========
        (function() {
            const mouseFollower = document.getElementById('mouse-follower');
            const mouseDot = document.getElementById('mouse-dot');
            const mouseCircle = document.getElementById('mouse-circle');
            
            if (mouseFollower && mouseDot && mouseCircle) {
                let mouseX = 0;
                let mouseY = 0;
                let circleX = 0;
                let circleY = 0;
                
                // 鼠标移动事件
                document.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    
                    // 直接更新小圆点位置
                    mouseDot.style.left = mouseX + 'px';
                    mouseDot.style.top = mouseY + 'px';
                });
                
                // 动画循环，实现圆圈追逐圆点
                function animate() {
                    // 计算圆圈到圆点的距离
                    const dx = mouseX - circleX;
                    const dy = mouseY - circleY;
                    
                    // 平滑追逐效果
                    circleX += dx * 0.1;
                    circleY += dy * 0.1;
                    
                    // 更新圆圈位置
                    mouseCircle.style.left = circleX + 'px';
                    mouseCircle.style.top = circleY + 'px';
                    
                    // 继续动画
                    requestAnimationFrame(animate);
                }
                
                // 鼠标点击事件
                document.addEventListener('click', () => {
                    mouseCircle.style.transform = 'translate(-50%, -50%) scale(1.5)';
                    setTimeout(() => {
                        mouseCircle.style.transform = 'translate(-50%, -50%) scale(1)';
                    }, 150);
                });
                
                // 启动动画
                animate();
            }
        })();
    </script>
</body>
</html>

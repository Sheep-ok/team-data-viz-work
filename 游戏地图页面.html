<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=1527, user-scalable=yes">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 1527px;
        height: 740px;
        overflow: hidden; 
      }
    </style>
    <meta charset="UTF-8">
    <title>游戏地图</title>
    <style>
        body {
            background: url('游戏地图.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            font-family: "SimSun", "宋体", serif;
        }

        * {
            font-family: inherit;
        }
        
        /* ========== 顶部下拉菜单导航样式 ========== */
        /* 导航栏容器 */
        #top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: transparent;
            z-index: 9000;
        }

        /* 导航内容容器 */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* 导航品牌 */
        .nav-brand {
            padding: 5px 0;
            margin-right: 15px;
        }

        .nav-brand a {
            color: #fffdf0;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .nav-brand a:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 导航菜单 */
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
        }

        /* 导航链接 */
        .nav-link {
            display: block;
            padding: 12px 20px;
            color: #fffdf0;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            background: transparent;
        }

        .nav-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            min-width: 120px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(101, 67, 33, 0.5);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9100;
            padding: 0;
            margin: 0;
        }

        .dropdown-item {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .dropdown-link {
            display: block;
            padding: 8px 12px;
            color: #fffdf0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .dropdown-link:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #fff;
        }

        .nav-item:hover .dropdown-menu {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }
        
        /* 建筑物容器 */
        .building-container {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .building-container:hover {
            transform: scale(1.1);
        }
        
        /* 气泡样式 */
        .bubble {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(128, 128, 128, 0.6);
            border: 2px solid #fff;
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .bubble.active {
            background: rgba(255, 204, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }
        
        /* 闪烁动画 */
        .bubble.pulse {
            animation: pulse 1s infinite;
        }
        
        /* 固定橙红色状态 */
        .bubble.orange {
            background: rgba(255, 69, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.8);
        }
        
        @keyframes pulse {
            0% {
                background: rgba(255, 107, 107, 0.6);
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
                transform: translateX(-50%) scale(1);
            }
            50% {
                background: rgba(255, 69, 0, 0.8);
                box-shadow: 0 0 20px rgba(255, 69, 0, 0.8);
                transform: translateX(-50%) scale(1.2);
            }
            100% {
                background: rgba(255, 107, 107, 0.6);
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
                transform: translateX(-50%) scale(1);
            }
        }
        
        /* 建筑物标签 */
        .building-label {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .building-container:hover .building-label {
            opacity: 1;
        }
        
        /* 触发框样式 */
        .trigger-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 600px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #654321;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(101, 67, 33, 0.5);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        .trigger-box.active {
            display: flex;
        }
        
        .trigger-box-header {
            padding: 20px;
            border-bottom: 1px solid #654321;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .trigger-box-title {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        
        .trigger-box-content-intro {
            color: #fff;
            font-size: 16px;
            line-height: 1.4;
            margin: 10px 0 0 0;
            padding: 0;
            width: 100%;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
            position: absolute;
            top: 15px;
            right: 20px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(101, 67, 33, 0.2);
        }
        
        .close-btn:hover {
            color: #654321;
            background: rgba(101, 67, 33, 0.4);
        }
        
        .trigger-box-content {
            flex: 1;
            padding: 20px;
            color: #fff;
            overflow-y: auto;
            display: flex;
            gap: 20px;
            position: relative;
        }
        
        .info-panel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            display: none;
            flex-direction: column;
            gap: 5px;
            border-radius: 10px;
            z-index: 1002;
        }
        
        .info-panel.active {
            display: flex;
        }
        
        .info-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .info-content {
            font-size: 14px;
            color: #ddd;
            line-height: 1.4;
        }
        
        .image-container {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .building-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .magnifier {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 3px solid #fff;
            border-radius: 50%;
            background-repeat: no-repeat;
            background-size: 500% 500%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: none;
            pointer-events: none;
        }
        
        .exploration-points {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .exploration-point {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #ff0;
            border-radius: 50%;
            background: rgba(255, 255, 0, 0.3);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .exploration-point:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 0, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
        }
        
        .trigger-box-footer {
            padding: 20px;
            border-top: 1px solid #654321;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .complete-btn {
            padding: 10px 20px;
            background: #654321;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .complete-btn:hover {
            background: #8B4513;
            box-shadow: 0 0 15px rgba(101, 67, 33, 0.5);
        }
        
        .data-btn {
            padding: 10px 20px;
            background: #654321;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .data-btn:hover {
            background: #8B4513;
            box-shadow: 0 0 15px rgba(101, 67, 33, 0.5);
        }
        
        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: none;
        }
        
        .overlay.active {
            display: block;
        }
        
        /* 任务进度指示器 */
        .progress-indicator {
            position: absolute;
            top: 80px;
            right: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #654321;
            border-radius: 25px;
            padding: 10px 20px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(101, 67, 33, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .progress-indicator .progress-text {
            white-space: nowrap;
        }
        
        .progress-indicator span {
            color: #fff;
            margin: 0 5px;
        }
        
        /* 下载成就图按钮 */
        .download-achievement-btn {
            padding: 5px 15px;
            background: #654321;
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: none;
        }
        
        .download-achievement-btn.show {
            display: inline-block;
        }
        
        .download-achievement-btn:hover {
            background: #8B4513;
            box-shadow: 0 0 10px rgba(101, 67, 33, 0.8);
        }
        
        /* 成功图片弹窗 */
        .success-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid #654321;
            border-radius: 20px;
            padding: 20px;
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(101, 67, 33, 0.8);
            max-width: 60vw;
            max-height: 60vh;
        }
        
        .success-modal.active {
            display: flex;
        }
        
        .success-image {
            max-width: 55vw;
            max-height: 55vh;
            border-radius: 10px;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        
        .download-btn {
            position: absolute;
            top: 10px;
            right: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #654321;
            border: 1px solid #654321;
            border-radius: 5px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .download-btn:hover {
            background: rgba(101, 67, 33, 0.3);
            box-shadow: 0 0 15px rgba(101, 67, 33, 0.8);
        }
        
        .close-success-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(101, 67, 33, 0.2);
        }
        
        .close-success-btn:hover {
            color: #654321;
            background: rgba(101, 67, 33, 0.4);
        }
    </style>
</head>

        // 保存任务状态到本地存储
        function saveProgress() {
            const completedBuildings = [];
            buildingContainers.forEach((container, index) => {
                const bubble = container.querySelector('.bubble');
                if (bubble.classList.contains('active')) {
                    completedBuildings.push(container.dataset.building);
                }
            });
            localStorage.setItem('completedBuildings', JSON.stringify(completedBuildings));
        }
        
        // 重置所有任务
        function resetProgress() {
            buildingContainers.forEach(container => {
                const bubble = container.querySelector('.bubble');
                bubble.classList.remove('active');
            });
            localStorage.removeItem('completedBuildings');
            updateProgress();
        }
        
        // 从本地存储加载任务状态
        function loadProgress() {
            // 检查是否是通过链接跳转来的页面
            if (document.referrer) {
                // 是通过链接跳转，从本地存储加载进度
                const completedBuildings = JSON.parse(localStorage.getItem('completedBuildings') || '[]');
                buildingContainers.forEach(container => {
                    if (completedBuildings.includes(container.dataset.building)) {
                        const bubble = container.querySelector('.bubble');
                        bubble.classList.add('active');
                    }
                });
            } else {
                // 是直接访问或刷新，重置所有任务
                resetProgress();
            }
        }
        
        // 更新进度函数
        function updateProgress() {
            const completedBuildings = document.querySelectorAll('.bubble.active').length;
            completedCountElement.textContent = completedBuildings;
            
            // 保存进度到本地存储
            saveProgress();
            
            // 检查是否完成所有任务

                    successModal.classList.add('active');
                    // 显示下载成就图按钮
                    downloadAchievementBtn.classList.add('show');
                }, 10000);
            } else {
                // 隐藏下载成就图按钮
                downloadAchievementBtn.classList.remove('show');
            }

        // 从本地存储加载进度
        loadProgress();
        // 初始化进度

                            setTimeout(() => {

        // 获取图片、放大镜和信息面板元素
        const buildingImage = document.getElementById('buildingImage');

        const imageContainer = document.querySelector('.image-container');
        const explorationPoints = document.getElementById('explorationPoints');
        const infoPanel = document.getElementById('infoPanel');
        
        // 初始化探索点
        function initExplorationPoints(buildingName) {
            // 清空现有探索点
            explorationPoints.innerHTML = '';
            
            // 隐藏信息面板
            infoPanel.classList.remove('active');
            
            // 获取当前建筑物的探索点数据
            const points = buildingData[buildingName].explorationPoints;
            
            // 为每个探索点创建元素
            points.forEach(point => {
                const pointElement = document.createElement('div');
                pointElement.className = 'exploration-point';
                pointElement.style.left = point.x + '%';
                pointElement.style.top = point.y + '%';
                pointElement.dataset.title = point.title;
                pointElement.dataset.content = point.content;
                
                // 添加鼠标悬停事件 - 关闭放大镜
                pointElement.addEventListener('mouseenter', function() {
                    magnifier.style.display = 'none';
                });
                
                // 添加鼠标离开事件 - 恢复放大镜
                pointElement.addEventListener('mouseleave', function() {
                    magnifier.style.display = 'block';
                });
                
                // 添加点击事件 - 显示文字，探索点消失，放大镜出现
                pointElement.addEventListener('click', function(e) {
                    e.stopPropagation();
                    // 隐藏该探索点
                    this.style.display = 'none';
                    // 显示放大镜
                    magnifier.style.display = 'block';
                    // 显示信息面板（一直显示在下面）
                    infoPanel.innerHTML = `
                        <div class="info-title">${this.dataset.title}</div>
                        <div class="info-content">${this.dataset.content}</div>
                    `;
                    infoPanel.classList.add('active');
                });
                
                explorationPoints.appendChild(pointElement);
            });
        }
        
        // 为每个建筑物添加点击事件
        buildingContainers.forEach(container => {
            container.addEventListener('click', function() {
                const buildingName = this.dataset.building;
                currentBuilding = this;
                
                // 标记任务完成，气泡变亮
                const bubble = this.querySelector('.bubble');
                // 移除orange类，添加active类（黄色）
                bubble.classList.remove('orange');
                bubble.classList.add('active');
                
                // 更新进度
                updateProgress();
                
                // 更新触发框内容
                boxTitle.textContent = buildingData[buildingName].title;
                boxContentIntro.textContent = buildingData[buildingName].content;
                buildingImage.src = buildingData[buildingName].image;
                
                // 初始化探索点
                initExplorationPoints(buildingName);
                
                // 显示遮罩层和触发框
                overlay.classList.add('active');
                triggerBox.classList.add('active');
            });
        });
        
        // 放大镜功能
        imageContainer.addEventListener('mousemove', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 计算鼠标在图片上的位置
            const imgRect = buildingImage.getBoundingClientRect();
            const imgX = x - (imgRect.left - rect.left);
            const imgY = y - (imgRect.top - rect.top);
            
            // 确保鼠标在图片范围内
            if (imgX >= 0 && imgX <= imgRect.width && imgY >= 0 && imgY <= imgRect.height) {
                // 显示放大镜
                magnifier.style.display = 'block';
                
                // 计算放大镜位置（居中）
                magnifier.style.left = (x - 75) + 'px';
                magnifier.style.top = (y - 75) + 'px';
                
                // 计算背景图片位置（2倍放大）
                const bgX = (imgX / imgRect.width) * 100;
                const bgY = (imgY / imgRect.height) * 100;
                
                magnifier.style.backgroundImage = `url('${buildingImage.src}')`;
                magnifier.style.backgroundPosition = `${bgX}% ${bgY}%`;
            } else {
                // 鼠标移出图片范围，隐藏放大镜
                magnifier.style.display = 'none';
            }
        });
        
        // 鼠标离开容器时隐藏放大镜
        imageContainer.addEventListener('mouseleave', function() {
            magnifier.style.display = 'none';
        });
        
        // 关闭按钮事件
        closeBtn.addEventListener('click', function() {
            overlay.classList.remove('active');
            triggerBox.classList.remove('active');
            currentBuilding = null;
            // 清空探索点
            explorationPoints.innerHTML = '';
            // 隐藏信息面板
            infoPanel.classList.remove('active');
        });
        
        // 完成任务按钮事件
        completeBtn.addEventListener('click', function() {
            // 直接关闭触发框，因为任务已经在点击气泡时完成
            overlay.classList.remove('active');
            triggerBox.classList.remove('active');
            currentBuilding = null;
            // 清空探索点
            explorationPoints.innerHTML = '';
            // 隐藏信息面板
            infoPanel.classList.remove('active');
        });
        
        // 查看数据按钮事件
        dataBtn.addEventListener('click', function() {
            if (currentBuilding) {
                const buildingName = currentBuilding.dataset.building;
                // 建筑物名称到cardIndex的映射
                const buildingToCardIndex = {
                    '北京四合院': 0, // 京派
                    '广东镬耳墙': 1, // 粤派
                    '安徽马头墙': 2, // 徽派
                    '苏州庭院': 3,   // 苏派
                    '山西大院': 4,   // 晋派
                    '福建土楼': 5,   // 闽派
                    '上海石库门': 6, // 海派
                    '川渝吊脚楼': 7  // 川派
                };
                
                const cardIndex = buildingToCardIndex[buildingName];
                if (cardIndex !== undefined) {
                    // 跳转到对应派别的数据可视页面
                    window.location.href = '数据可视页面.html?cardIndex=' + cardIndex;
                }
            }
        });
        
        // 点击遮罩层关闭
        overlay.addEventListener('click', function() {
            overlay.classList.remove('active');
            triggerBox.classList.remove('active');
            currentBuilding = null;
            // 清空探索点
            explorationPoints.innerHTML = '';
            // 隐藏信息面板
            infoPanel.classList.remove('active');
        });
        
        // 阻止触发框内部点击事件冒泡
        triggerBox.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // 绑定返回抽卡按钮点击事件
        backToDrawBtn.addEventListener('click', function() {
            window.location.href = '抽卡页面.html';
        });
        
        // 绑定前往数据页面按钮点击事件
        goToDataBtn.addEventListener('click', function() {
            window.location.href = '数据可视页面.html';
        });
        
        // 关闭成功图片弹窗
        closeSuccessBtn.addEventListener('click', function() {
            successModal.classList.remove('active');
        });
        
        // 清除所有已探索点按钮事件
        resetProgressBtn.addEventListener('click', function() {
            resetProgress();
        });
    </script>
</body>
</html>
